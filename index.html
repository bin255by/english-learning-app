<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover：让底部 Tab 栏能正确适配 iPhone 安全区 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>零基础英语学习</title>
  <meta name="description" content="面向英语初学者：所有英文都能点击朗读，含词根词缀、场景对话、主题单词与常用网站。" />
  <meta name="theme-color" content="#2EAFA0" />

  <!-- PWA：添加到主屏幕 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="轻轻学英语" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />

  <!-- 第三方：Swiper 11（首页卡片轮播）官方样式放在最前面，方便后面覆盖 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <!-- 样式加载顺序：base(变量/排版/骨架) → components(通用组件) → 各页面样式 -->
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/roots.css" />
  <link rel="stylesheet" href="css/dialogues.css" />
  <link rel="stylesheet" href="css/vocabulary.css" />
  <link rel="stylesheet" href="css/websites.css" />
</head>
<body>
  <!-- 移动端优先，最大宽度 520px，桌面端居中显示为"手机容器" -->
  <div class="app-shell">

    <!-- ===== 顶部固定区：常驻搜索框 + 朗读工具条（逻辑见 js/search.js） ===== -->
    <!-- 原「轻轻学英语 / Every English word is clickable」标题行已按第 2 轮需求删除，
         浏览器标签页标题 <title>轻轻学英语</title> 保留不动。
         第 3 轮起搜索框回退为【常驻显示】：不再有放大镜入口按钮，也不再有「取消」按钮。 -->
    <header class="app-header">

      <!-- 站内搜索：输入框常驻可见，左侧 🔍 仅为装饰（不可点击），点输入框才聚焦 -->
      <div class="search" id="searchBox" role="search">
        <span class="search__icon" aria-hidden="true">🔍</span>
        <input id="searchInput" class="search__input" type="search"
               placeholder="搜索 单词 / 场景 / 网站" aria-label="站内搜索"
               role="combobox" aria-expanded="false" aria-controls="searchResults"
               aria-autocomplete="list" aria-haspopup="listbox"
               autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" />
        <button id="searchClear" class="search__clear" type="button" aria-label="清空搜索" hidden>✕</button>
        <div id="searchResults" class="search__results" role="listbox" aria-label="搜索结果" hidden></div>
      </div>

      <!-- ===== 朗读工具条：[ - ] [ 1.00 ] [ + ] [ 停止朗读 ] 同行（界面见 js/speech-feedback.js） ===== -->
      <div class="speakbar">
        <span class="speakbar__label" aria-hidden="true">🔈 语速</span>
        <div class="rate" id="rateGroup" role="group" aria-label="朗读语速">
          <button class="rate__btn rate__btn--step" type="button" data-rate-step="-1" aria-label="降低语速">−</button>
          <span class="rate__value" id="rateValue" role="status" aria-live="polite" aria-atomic="true"
                aria-label="当前语速">0.90</span>
          <button class="rate__btn rate__btn--step" type="button" data-rate-step="1" aria-label="提高语速">+</button>
        </div>
        <span class="speak-status" id="speakStatus" role="status" aria-live="polite" hidden>朗读中</span>
        <button class="btn btn--ghost btn--stop" id="stopSpeak" type="button" disabled>
          <span aria-hidden="true">⏹</span>停止朗读
        </button>
      </div>
    </header>

    <!-- ===== 安装到主屏幕提示（Android/桌面 Chrome 触发 beforeinstallprompt 后显示；iOS 走系统「添加到主屏幕」） ===== -->
    <div class="install-banner" id="installBanner" hidden>
      <p class="install-banner__text">把「轻轻学英语」添加到主屏幕：全屏打开、没有地址栏，断网也能学。</p>
      <div class="install-banner__actions">
        <button type="button" class="btn btn--primary" id="installBtn">添加到主屏幕</button>
        <button type="button" class="btn btn--soft" id="installLater">以后再说</button>
      </div>
    </div>

    <!-- ===== 内容区：各 Tab 视图由 js/app.js 渲染 ===== -->
    <main id="appMain" class="app-main" tabindex="-1"></main>

    <!-- ===== 底部固定 Tab 栏：5 个 ===== -->
    <nav id="tabbar" class="tabbar" aria-label="主导航">
      <a class="tabbar__item" href="#/home" data-tab="home">
        <span class="tabbar__icon" aria-hidden="true">🏠</span>
        <span class="tabbar__label">首页</span>
      </a>
      <a class="tabbar__item" href="#/roots" data-tab="roots">
        <span class="tabbar__icon" aria-hidden="true">🧩</span>
        <span class="tabbar__label">词根词缀</span>
      </a>
      <a class="tabbar__item" href="#/dialogues" data-tab="dialogues">
        <span class="tabbar__icon" aria-hidden="true">💬</span>
        <span class="tabbar__label">场景对话</span>
      </a>
      <a class="tabbar__item" href="#/vocabulary" data-tab="vocabulary">
        <span class="tabbar__icon" aria-hidden="true">📚</span>
        <span class="tabbar__label">主题单词</span>
      </a>
      <a class="tabbar__item" href="#/websites" data-tab="websites">
        <span class="tabbar__icon" aria-hidden="true">🌐</span>
        <span class="tabbar__label">常用网站</span>
      </a>
    </nav>
  </div>

  <!-- 全局轻提示（toast） -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- 第三方：Fuse.js 7（全站模糊搜索）。加载失败时 js/search.js 自动降级为子串匹配 -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>

  <!-- 第三方：Swiper 11（UMD，暴露 window.Swiper）。加载失败时 js/home.js 会自动降级为横向滚动 -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- 唯一入口：原生 ES6 模块（Fuse.js / Swiper 为全局 UMD，已在上方引入） -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
